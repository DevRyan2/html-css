<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/style.css">
    <title>Login</title>
</head>
<body>

    <main>


            <img src="imagens/metal.jpg" alt="">
        

        <h1>Login</h1>

        <p>
            Seja bem-vindo(a) novamente. Faça <br>
            login para acessar sua conta e poder <br>
            fazer as configurações no seu ambiente.
        </p>

        <div class="formulario">
            <form action="cadastro.php" method="post" autocomplete="off">
                <div>
                    <input type="email" name="email" id="iemail" autocomplete="off" required placeholder="seu e-mail">
                </div>
                <div>
                    <input type="password" name="senha" id="isenha" autocomplete="off" required placeholder="sua senha" >
                </div>
                <div>
                    <input type="submit" value="Entrar">
                </div>
                <div>
                    <button type="button">Esqueci a senha</button>
                </div>
            </form>
        </div>

    </main>
    
</body>
</html>

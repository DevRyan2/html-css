<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fontes Externas</title>
        <style>
            @font-face {
                font-family: 'Love larry';
                src: url(fontes/love\ larry\ ttf.ttf) format(truetype);
                font-weight: normal;
                font-style: normal;

                /* 

                TIPOS DE FORMAT()
                - opentype (.otf)
                - truetype (.ttf)
                - embedded-opentype
                - truetype-aat (Apple Advanced Typography)s
                - svg

                */
            }

            body {
                font-family: Arial, Helvetica, sans-serif;
            }

            h1 {
                font-family: 'Love larry', Times, serif;
                font-weight: normal;
            }
        </style>
    </head>
    <body>
        <h1>Olá, Mundo!</h1>

        <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Praesentium
            molestiae eveniet mollitia adipisci eaque nemo deleniti, earum vitae
            ut minima iste ea dolor voluptatem nesciunt quo ducimus omni
            animi.
        </p>
    </body>
</html>

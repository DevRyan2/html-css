<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>

        div.container {
            display: flex;
            flex-flow: row wrap;
            align-items: flex-start;

            border: 1px solid black;
            height: 400px;

            background-color: aqua;
        }

        div.item {
            border: 1px solid black;
            padding: 20px;

            background-color: blue;

            text-align: center;
        }

        div#i1 { /* A */
            align-self: flex-end;
        }

        div#i2 { /* B */
            align-self: auto;
        }

        div#i3 { /* C */
            align-self: flex-end;
        }

        div#i4 { /* D */
            align-self: flex-start;
        }

        div#i5 { /* E */
            align-self: center;
        }

        div#i6 { /* F */
            align-self: flex-start;
        }

        div#i7 { /* G */
            align-self: stretch;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>

    </div>
    
</body>
</html>

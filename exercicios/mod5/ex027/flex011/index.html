<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>

        div.container {
            display: flex;
            flex-flow: row nowrap;

            border: 1px solid black;

            background-color: aqua;
        }

        div.item {
            flex-basis: 200px;

            border: 1px solid black;

            background-color: blue;

            text-align: center;
        }

        div#cxa {
            flex-shrink: 0;
            flex-grow: 1;
        }

        div#cxb {
            flex-shrink: 1;
            flex-grow: 1;
        }

        div#cxc {
            flex-shrink: 8;
            flex-grow: 1;
        }

    </style>
</head>
<body>

    <div class="container">

        <div class="item" id="cxa">A</div>

        <div class="item" id="cxb">B</div>

        <div class="item" id="cxc">C</div>

    </div>
    
</body>
</html>
